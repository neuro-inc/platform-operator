bootstrap:
  image:
    repository: python
    tag: 3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    pullPolicy: IfNotPresent
  project: ""
  robot: platform-registry
  secretName: harbor-platform-registry
  waitSeconds: 900
  backoffLimit: 3
  priorityClassName: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

harbor:
  fullnameOverride: harbor
  externalURL: http://harbor-core
  existingSecretAdminPassword: harbor-secrets
  existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
  existingSecretSecretKey: harbor-secrets
  expose:
    type: clusterIP
    tls:
      enabled: false
  persistence:
    persistentVolumeClaim:
      database:
        size: 5Gi
      redis:
        size: 1Gi
    imageChartStorage:
      type: s3
      disableredirect: true
      s3:
        existingSecret: harbor-s3
  core:
    image:
      tag: v2.13.6
    existingSecret: harbor-secrets
    secretName: harbor-secrets
    existingXsrfSecret: harbor-secrets
    extraEnvVars:
      - name: POSTGRESQL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: harbor-secrets
            key: DATABASE_PASSWORD
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  jobservice:
    image:
      tag: v2.13.6
    existingSecret: harbor-secrets
    jobLoggers:
      - stdout
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  registry:
    existingSecret: harbor-secrets
    credentials:
      existingSecret: harbor-secrets
    registry:
      image:
        tag: v2.13.6
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
    controller:
      image:
        tag: v2.13.6
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
  nginx:
    image:
      tag: v2.13.6
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  portal:
    image:
      tag: v2.13.6
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  trivy:
    enabled: false
  database:
    internal:
      image:
        tag: v2.13.6
      extraEnvVars:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-secrets
              key: DATABASE_PASSWORD
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
  redis:
    internal:
      image:
        tag: v2.13.6
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 512Mi
