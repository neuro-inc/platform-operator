suite: platform-harbor network policy
release:
  name: harbor
  namespace: platform
templates:
  - templates/network-policy.yaml
tests:
  - it: should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: should allow the configured core clients
    set:
      networkPolicy.coreClients:
        - service: platform-registry
        - app: other
    documentIndex: 1
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app: other
