apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-internal
  labels: {{ include "platform.labels.common" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "platform.harbor.matchLabels" . | nindent 6 }}
    matchExpressions:
    - key: component
      operator: In
      values:
      - database
      - redis
      - registry
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels: {{ include "platform.harbor.matchLabels" . | nindent 10 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-core
  labels: {{ include "platform.labels.common" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "platform.harbor.matchLabels" . | nindent 6 }}
      component: core
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels: {{ include "platform.harbor.matchLabels" . | nindent 10 }}
    - podSelector:
        matchLabels:
          service: {{ .Release.Name }}-bootstrap
    {{- range .Values.networkPolicy.coreClients }}
    - podSelector:
        matchLabels: {{ toYaml . | nindent 10 }}
    {{- end }}
