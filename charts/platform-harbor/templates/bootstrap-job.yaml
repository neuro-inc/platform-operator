apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels: {{ include "platform.labels.common" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  template:
    metadata:
      labels: {{ include "platform.labels.common" . | nindent 8 }}
        service: {{ .Release.Name }}-bootstrap
      annotations:
        checksum/script: {{ .Files.Get "files/bootstrap.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.bootstrap.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bootstrap
        image: "{{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}"
        imagePullPolicy: {{ .Values.bootstrap.image.pullPolicy }}
        command: ["python", "/app/bootstrap.py"]
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: HARBOR_URL
          value: http://{{ required "harbor.fullnameOverride is required" .Values.harbor.fullnameOverride }}-core
        - name: HARBOR_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.harbor.existingSecretAdminPassword }}
              key: {{ .Values.harbor.existingSecretAdminPasswordKey }}
        - name: HARBOR_PROJECT
          value: {{ required "bootstrap.project is required" .Values.bootstrap.project | quote }}
        - name: CREDENTIALS_SECRET
          value: harbor-platform-registry
        - name: ROBOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: harbor-platform-registry
              key: username
              optional: true
        - name: ROBOT_SECRET
          valueFrom:
            secretKeyRef:
              name: harbor-platform-registry
              key: password
              optional: true
        {{- with required "harbor.persistence.imageChartStorage.s3.existingSecret is required" .Values.harbor.persistence.imageChartStorage.s3.existingSecret }}
        - name: S3_SECRET
          value: {{ . | quote }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: REGISTRY_STORAGE_S3_ACCESSKEY
              optional: true
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: REGISTRY_STORAGE_S3_SECRETKEY
              optional: true
        {{- end }}
        - name: WAIT_SECONDS
          value: {{ .Values.bootstrap.waitSeconds | quote }}
        {{- if and .Values.bootstrap.retention.enabled (empty .Values.bootstrap.retention.rules) }}
        {{- fail "bootstrap.retention.rules is required when retention is enabled" }}
        {{- end }}
        - name: RETENTION
          value: {{ .Values.bootstrap.retention | toJson | quote }}
        - name: GC
          value: {{ .Values.bootstrap.gc | toJson | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.bootstrap.resources | nindent 10 }}
        volumeMounts:
        - name: script
          mountPath: /app
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: {{ .Release.Name }}-bootstrap
