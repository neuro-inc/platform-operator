{{- define "platform.argocd.applications.platformRegistry.values" -}}
{{- $platformUrls := include "platform.urls" . | fromYaml -}}
{{- $registryUrl := include "platform.registryUrl" . | urlParse -}}
image:
  repository: ghcr.io/neuro-inc/platformregistryapi
securityContext:
  enabled: true
service:
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: NEURO_REGISTRYAPI_SESSION
platform:
  clusterName: {{ include "platform.clusterName" . }}
  authUrl: {{ get $platformUrls "authUrl" }}
  adminUrl: {{ printf "%s/apis/admin/v1" (get $platformUrls "adminUrl") }}
  eventsUrl: {{ printf "%s/apis/events" (get $platformUrls "eventsUrl") }}
  token:
    {{- include "platform.token" . | nindent 4 }}
ingress:
  enabled: true
  {{- with .Values.defaultIngressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  hosts:
  - {{ $registryUrl.host }}
priorityClassName: {{ include "platform.priorityClassName" . }}
{{- with .Values.sentry }}
sentry:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

{{- define "platform.argocd.applications.platformRegistry.harborUpstream" -}}
type: basic
url: http://harbor-core
project: {{ .Values.argocdApplications.harbor.project }}
basicUsername:
  valueFrom:
    secretKeyRef:
      name: harbor-platform-registry
      key: username
basicPassword:
  valueFrom:
    secretKeyRef:
      name: harbor-platform-registry
      key: password
{{- end }}

{{- if .Values.argocdApplications.platformRegistry.enabled }}
{{- $cfg := deepCopy .Values.argocdApplications.platformRegistry -}}
{{- if not (has $cfg.upstream (list "dockerRegistry" "harbor")) }}
{{- fail "argocdApplications.platformRegistry.upstream must be dockerRegistry or harbor" }}
{{- end }}
{{- if eq $cfg.upstream "harbor" }}
{{- if not .Values.argocdApplications.harbor.enabled }}
{{- fail "argocdApplications.harbor.enabled is required for the harbor upstream" }}
{{- end }}
{{- $values := default dict $cfg.values -}}
{{- $upstream := default dict $values.upstreamRegistry -}}
{{- range $k, $v := include "platform.argocd.applications.platformRegistry.harborUpstream" . | fromYaml }}
{{- $_ := set $upstream $k $v -}}
{{- end }}
{{- $_ := set $values "upstreamRegistry" $upstream -}}
{{- $_ := set $cfg "values" $values -}}
{{- end }}
{{- $_ := set $cfg "root" . -}}
{{- $_ := set $cfg "defaultValues" (include "platform.argocd.applications.platformRegistry.values" . | fromYaml) -}}
{{- include "platform.argocd.application" $cfg }}
{{- end }}
