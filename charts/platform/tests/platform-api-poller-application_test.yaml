suite: test platform api poller application
release:
  name: platform
  namespace: platform
templates:
  - platform-api-poller-application.yaml
values:
  - common-values.yaml
set:
  storages:
    - path: /storage
      size: 10Gi
tests:
  - it: should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: should add the token filter middleware to job ingresses
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.jobs.ingressTokenFilterMiddleware
          value: platform-platform-token-filter@kubernetescrd
