suite: test docker registry application
release:
  name: platform
  namespace: platform
templates:
  - docker-registry-application.yaml
values:
  - common-values.yaml
tests:
  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: should match snapshot
    set:
      argocdApplications.dockerRegistry.enabled: true
    asserts:
      - matchSnapshot: {}
