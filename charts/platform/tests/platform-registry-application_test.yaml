suite: test platform registry application
release:
  name: platform
  namespace: platform
templates:
  - platform-registry-application.yaml
values:
  - common-values.yaml
tests:
  - it: should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: should use harbor as the upstream by default
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.upstreamRegistry
          value:
            type: basic
            url: http://harbor-core
            project: neuro
            basicUsername:
              valueFrom:
                secretKeyRef:
                  name: harbor-platform-registry
                  key: username
            basicPassword:
              valueFrom:
                secretKeyRef:
                  name: harbor-platform-registry
                  key: password
  - it: should take the project from harbor
    set:
      argocdApplications.harbor.project: other
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.upstreamRegistry.project
          value: other
  - it: should leave the upstream to values for docker registry
    set:
      argocdApplications.platformRegistry.upstream: dockerRegistry
    asserts:
      - notExists:
          path: spec.source.helm.valuesObject.upstreamRegistry
  - it: should fail on the harbor upstream without harbor
    set:
      argocdApplications.harbor.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: argocdApplications.harbor.enabled is required for the harbor upstream
  - it: should let values override the harbor upstream
    set:
      argocdApplications.platformRegistry.values:
        upstreamRegistry:
          maxCatalogEntries: 10000
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.upstreamRegistry
          value:
            type: basic
            url: http://harbor-core
            project: neuro
            maxCatalogEntries: 10000
            basicUsername:
              valueFrom:
                secretKeyRef:
                  name: harbor-platform-registry
                  key: username
            basicPassword:
              valueFrom:
                secretKeyRef:
                  name: harbor-platform-registry
                  key: password
  - it: should keep an upstream set in values for docker registry
    set:
      argocdApplications.platformRegistry.upstream: dockerRegistry
      argocdApplications.platformRegistry.values:
        upstreamRegistry:
          url: http://platform-docker-registry:5000
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.upstreamRegistry.url
          value: http://platform-docker-registry:5000
  - it: should fail on an unknown upstream
    set:
      argocdApplications.platformRegistry.upstream: other
    asserts:
      - failedTemplate:
          errorMessage: argocdApplications.platformRegistry.upstream must be dockerRegistry or harbor
