suite: test traefik application
release:
  name: platform
  namespace: platform
templates:
  - traefik-application.yaml
values:
  - common-values.yaml
tests:
  - it: should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: should carry only the global sync options
    asserts:
      - equal:
          path: spec.syncPolicy.syncOptions
          value:
            - CreateNamespace=true
            - PrunePropagationPolicy=foreground
