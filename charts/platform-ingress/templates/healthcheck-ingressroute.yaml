apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-healthcheck
  labels: {{ include "platform.labels.common" . | nindent 4 }}
spec:
  routes:
  - kind: Rule
    match: Method(`OPTIONS`)
    priority: 2
    services:
    - kind: TraefikService
      name: ping@internal
